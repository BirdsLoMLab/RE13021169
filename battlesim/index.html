// ============================================================
// MODULE 9: CombatEngine — 30 FPS Frame Loop
// ============================================================
class CombatEngine {
  constructor(battleMain) {
    this.bm = battleMain;
    this.frame = 0;
    this.maxFrames = 9000; // 5 min at 30fps
    this.running = false;
    this.winner = null;
    this.log = new CombatLog();
  }

  reset() {
    this.frame = 0;
    this.running = false;
    this.winner = null;
    this.log.clear();
  }

  // --- healthTarget: applies Total DMG Bonus/RES ---
  // Source: game_script.js line 7229
  healthTarget(target, damage, healthType, attacker) {
    if (IS_DAMAGE_TYPE.has(healthType) && attacker && attacker !== target) {
      let add = attacker.getAttrib(1081);
      let def = target.getAttrib(1082);
      let mult = Math.max(1 + add - def, TOTAL_DAM_FLOOR);
      damage = FM.round(damage * mult);
    }
    damage = FM.roundInt(damage);
    target.damageQueue.push({ damage, healthType, attacker });
  }

  // --- Process Damage Queue (Unit.addDamage) ---
  // Source: game_script.js line 449240
  processDamageQueue(unit) {
    // HP recovery tick
    let hpRec = unit.getAttrib(1012);
    let ignHpRec = unit.getAttrib(1066);
    let recAmount = FM.roundInt(FM.round(unit.getAttrib(1002) * FM.round(hpRec - ignHpRec)) * this.bm.treatDecay);
    if (recAmount > 0) {
      // Apply reduce heal buffs
      let heals = unit.getBuffsByGroup(BG.REDUCE_HEAL);
      for (let h of heals) recAmount = h.calHeal(recAmount);
      if (recAmount > 0) {
        unit.curHP = Math.min(FM.roundInt(unit.curHP + recAmount), unit.maxHP);
      }
    }

    for (let evt of unit.damageQueue) {
      let dmg = evt.damage;
      let ht = evt.healthType;

      if (IS_DAMAGE_TYPE.has(ht)) {
        // Step 1: PvP reduction
        dmg = Math.max(FM.roundInt(dmg / this.bm.injuryReduce), 1);

        // Step 2: Shield absorption
        if (unit.shieldHP > 0) {
          let shields = unit.getBuffsByGroup(BG.SHIELD);
          for (let s of shields) {
            if (dmg <= 0) break;
            let absorbed = s.absorb(dmg);
            dmg = FM.roundInt(dmg - absorbed);
          }
          unit.shieldHP = Math.max(0, unit.shieldHP);
        }

        // Step 3: Block absorption (BuffBlock)
        let blocks = unit.getBuffsByGroup(BG.BLOCK);
        for (let b of blocks) {
          if (dmg <= 0) break;
          if (b.absorb) {
            let absorbed = b.absorb(dmg);
            dmg = FM.roundInt(dmg - absorbed);
          }
        }

        dmg = Math.max(0, dmg);

        // Step 4: HP reduction
        unit.curHP = FM.roundInt(unit.curHP - dmg);

        // Step 5: Death prevention chain
        if (unit.curHP <= 0) {
          // Check immune death
          if (unit.hasBuffGroup(BG.IMMUNE_DEATH)) {
            unit.curHP = 1;
            unit.removeBuffsByGroup(BG.IMMUNE_DEATH);
            this.log.add(this.frame, 'buff', `${unit.id} IMMUNE DEATH triggered (1 HP)`);
          }
        }

        // Record damage
        let recBufs = unit.getBuffsByGroup(BG.RECORD_DAMAGE);
        for (let rb of recBufs) rb.addDamage(dmg);

      } else if (ht === HT.Treat || ht === HT.Treat_Crit || ht === HT.Skill_Hpsteal || ht === HT.Act_Hpsteal) {
        // Heal
        let heal = dmg;
        heal = FM.roundInt(heal * this.bm.treatDecay);
        // Reduce heal buffs
        let heals = unit.getBuffsByGroup(BG.REDUCE_HEAL);
        for (let h of heals) heal = h.calHeal(heal);
        unit.curHP = Math.min(FM.roundInt(unit.curHP + heal), unit.maxHP);
      }
    }
    unit.damageQueue = [];

    // Clamp
    unit.curHP = Math.max(0, unit.curHP);
    if (unit.curHP <= 0) {
      unit.isDead = true;
    }
  }

  // --- Execute a normal attack ---
  executeAttack(attacker, defender) {
    if (attacker.isDead || defender.isDead) return;

    // Hit check
    let hitType = DamageEngine.checkHit(attacker, defender, this.bm.rng, this.bm.isPvP, false);

    if (hitType === 0) {
      // Miss
      this.log.add(this.frame, 'miss', `${attacker.id} ATK → ${defender.id}: MISS`);
      return;
    }

    // Calculate damage
    let dmg = DamageEngine.normalHurt(attacker, defender, hitType, this.bm.rng, true);
    let htType = hitType === 2 ? HT.Hurt_Crit : HT.Hurt;

    // Apply FRAGILE_EFFECT (on defender, bonus from attacker)
    let fragiles = defender.getBuffsByGroup(BG.FRAGILE_EFFECT);
    let fragileBonus = 0;
    for (let f of fragiles) fragileBonus += f.calDamage(dmg, attacker);
    dmg += fragileBonus;

    // Apply EXTRA_DAMAGE
    let extras = attacker.getBuffsByGroup(BG.EXTRA_DAMAGE);
    for (let e of extras) dmg = e.calDamage(dmg, defender);

    // Apply GIANT_SLAYER
    let giants = attacker.getBuffsByGroup(BG.GIANT_SLAYER);
    for (let g of giants) dmg = g.calDamage(dmg, defender);

    // Boss damage
    if (defender.unitType !== 1 && defender.unitType !== 12) {
      let bossDam = attacker.getAttrib(1046);
      if (bossDam > 0) dmg = FM.roundInt(dmg * FM.round(1 + bossDam));
    }

    let detailParts = [];
    let atk = attacker.getAttrib(1001);
    let def2 = defender.getAttrib(1024);
    let defCoe = defender.getAttrib(1060);
    let baseRaw = Math.max(FM.roundInt(atk - def2 * FM.round(1 + defCoe)), 1);
    detailParts.push(`base=${baseRaw}`);
    if (hitType === 2) detailParts.push(`CRIT×${DamageEngine.critMultiplier(attacker,defender).toFixed(2)}`);
    if (fragileBonus) detailParts.push(`fragile+${fragileBonus}`);
    detailParts.push(`final=${dmg}`);

    let logType = hitType === 2 ? 'crit' : 'dmg';
    this.log.add(this.frame, logType,
      `${attacker.id} ATK → ${defender.id}: ${dmg} ${hitType===2?'CRIT':''}`,
      detailParts.join(' | '));

    this.healthTarget(defender, dmg, htType, attacker);

    // HP steal
    let stealDmg = DamageEngine.normalHpsteal(attacker, defender, dmg);
    if (stealDmg > 0) {
      this.healthTarget(attacker, stealDmg, HT.Act_Hpsteal, attacker);
    }

    // Stun check
    if (DamageEngine.checkDizz(attacker, defender, this.bm.rng)) {
      let stunDur = FM.round(attacker.getAttrib(1030) * FM.round(1 - defender.getAttrib(1031)));
      let stunFrames = Math.max(1, FM.roundInt(stunDur * 30));
      // Apply CONTROL_RES
      let cr = defender.getAttrib(1042);
      stunFrames = FM.roundInt(stunFrames * FM.round(1 - cr));
      if (stunFrames > 0) {
        defender.stunFrames = Math.max(defender.stunFrames, stunFrames);
        this.log.add(this.frame, 'buff', `${defender.id} STUNNED for ${stunFrames} frames`);
      }
    }

    // Combo check
    if (DamageEngine.checkDoubleAct(attacker, defender, this.bm.rng)) {
      let comboHit = DamageEngine.checkHit(attacker, defender, this.bm.rng, this.bm.isPvP, false);
      if (comboHit > 0) {
        let comboDmg = DamageEngine.normalDoubleHurt(attacker, defender, comboHit, this.bm.rng, true);
        let comboHt = comboHit === 2 ? HT.Hurt_Double_Crit : HT.Hurt_Double;
        // Fragile/Extra/Giant
        for (let f of fragiles) comboDmg += f.calDamage(comboDmg, attacker);
        for (let e of extras) comboDmg = e.calDamage(comboDmg, defender);
        for (let g of giants) comboDmg = g.calDamage(comboDmg, defender);

        this.log.add(this.frame, comboHit===2?'crit':'dmg',
          `${attacker.id} COMBO → ${defender.id}: ${comboDmg} ${comboHit===2?'CRIT':''}`, '');
        this.healthTarget(defender, comboDmg, comboHt, attacker);
      }
    }

    // Counter check (defender counters)
    if (!defender.isDead && DamageEngine.checkCounterAct(defender, attacker, this.bm.rng)) {
      let ctrHit = DamageEngine.checkHit(defender, attacker, this.bm.rng, this.bm.isPvP, false);
      if (ctrHit > 0) {
        let ctrDmg = DamageEngine.normalCounterHurt(defender, attacker, ctrHit, this.bm.rng, true);
        let ctrHt = ctrHit === 2 ? HT.Hurt_Counter_Crit : HT.Hurt_Counter;
        this.log.add(this.frame, ctrHit===2?'crit':'dmg',
          `${defender.id} COUNTER → ${attacker.id}: ${ctrDmg} ${ctrHit===2?'CRIT':''}`, '');
        this.healthTarget(attacker, ctrDmg, ctrHt, defender);
      }
    }
  }

  // --- Execute Skill ---
  executeSkill(unit, skill, target) {
    if (unit.isDead || target.isDead) return;
    this.log.add(this.frame, 'info', `${unit.id} uses ${skill.name}`);

    for (let eff of skill.effects) {
      if (target.isDead && !eff.isHeal) continue;

      switch (eff.type) {
        case 'skill_value': {
          // BuffSkillValue simplified: calculate base, apply skill pipeline
          let dmg = this.calcSkillValue(unit, target, eff);
          if (eff.isHeal) {
            this.healthTarget(unit, Math.abs(dmg), HT.Treat, unit);
            this.log.add(this.frame, 'heal', `${unit.id} heals ${Math.abs(dmg)}`);
          } else {
            // Fragile/Extra/Giant
            let fragiles = target.getBuffsByGroup(BG.FRAGILE_EFFECT);
            for (let f of fragiles) dmg += f.calDamage(dmg, unit);
            let extras = unit.getBuffsByGroup(BG.EXTRA_DAMAGE);
            for (let e of extras) dmg = e.calDamage(dmg, target);
            let giants = unit.getBuffsByGroup(BG.GIANT_SLAYER);
            for (let g of giants) dmg = g.calDamage(dmg, target);

            this.healthTarget(target, dmg, HT.Hurt, unit);
            this.log.add(this.frame, 'dmg', `${unit.id} skill DMG → ${target.id}: ${dmg}`,
              `calType=${eff.calType} skillPar=${eff.skillPar}`);

            // Skill HP steal
            let steal = DamageEngine.skillHpsteal(unit, target, dmg);
            if (steal > 0) this.healthTarget(unit, steal, HT.Skill_Hpsteal, unit);
          }
        } break;

        case 'shield': {
          let shieldTarget = eff.targetSelf !== false ? unit : target;
          let shield = new BuffShield({
            buffId: 100 + Math.random()*1000|0,
            caster: unit, target: shieldTarget,
            skillPar: eff.skillPar, duration: eff.duration || 150,
            calType: eff.calType || 0, attribId: eff.attribId || 1002,
            isDec: eff.isDec !== undefined ? eff.isDec : 0,
            hpType: eff.hpType || 1,
            battleMain: this.bm, mutex: 3, addMax: 5
          });
          shieldTarget.addBuff(shield);
          this.log.add(this.frame, 'buff', `${shieldTarget.id} gains SHIELD (${shield.shieldValue} HP)`);
        } break;

        case 'bleed': {
          this.applyBleed(unit, target, eff);
        } break;

        case 'dizz': {
          let prob = eff.probability || 1;
          if (this.bm.rng.randomInt(0, 10000) <= FM.roundInt(10000 * prob)) {
            let dur = eff.duration || 60;
            let cr = target.getAttrib(1042);
            dur = FM.roundInt(dur * FM.round(1 - cr));
            if (dur > 0) {
              target.stunFrames = Math.max(target.stunFrames, dur);
              this.log.add(this.frame, 'buff', `${target.id} STUNNED by skill for ${dur} frames`);
            }
          }
        } break;

        case 'attrib_buff': {
          let ab = new BuffAttrib({
            buffId: eff.buffId || 200,
            attribId: eff.attribId, modType: eff.modType || 'flat',
            modValue: eff.modValue, duration: eff.duration || 150,
            caster: unit, mutex: eff.mutex || 1
          });
          let buffTarget = eff.targetSelf !== false ? unit : target;
          buffTarget.addBuff(ab);
          this.log.add(this.frame, 'buff', `${buffTarget.id} ${eff.modType} ${eff.attribId} ${eff.modValue>0?'+':''}${eff.modValue}`);
        } break;
      }
    }

    unit.energy = 0;
  }

  // --- Calculate BuffSkillValue damage ---
  // Source: data/formulas/buffs/skill_value.json
  calcSkillValue(caster, target, eff) {
    let calType = eff.calType || 1;
    let skillPar = eff.skillPar || 1;
    let ignoreFlag = eff.ignoreFlag || 0;
    let base = 0;

    let atk = caster.getAttrib(1001);
    let def = target.getAttrib(1024);
    let defCoe = target.getAttrib(1060);
    let atkMinusDef = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);

    switch (calType) {
      case 0: base = caster.getAttrib(eff.attribId || 1001); break;
      case 1: base = atkMinusDef; break;
      case 2: base = FM.roundInt(caster.getAttrib(1002) - target.curHP); break;
      case 3: base = target.curHP; break;
      case 4: base = FM.roundInt(atkMinusDef * caster.getAttrib(1039)); break;
      case 5: {
        let tAtk = target.getAttrib(1001);
        let tDef = target.getAttrib(1024);
        let tDefCoe = target.getAttrib(1060);
        base = FM.roundInt(Math.max(FM.roundInt(tAtk - tDef * FM.round(1 + tDefCoe)), 1) * target.getAttrib(1039));
      } break;
      case 6: base = Math.max(FM.roundInt(atkMinusDef * caster.getAttrib(1032)), 1); break;
      case 7: base = Math.max(FM.roundInt(atkMinusDef * caster.getAttrib(1033)), 1); break;
      case 8: base = caster.curHP; break;
      case 9: base = caster.getAttrib(1002); break;
      case 10: {
        // Partner damage
        let pAtk = caster.parent ? caster.parent.getAttrib(1001) : atk;
        let pDam = caster.getAttrib(1040);
        let pExtra = caster.getAttrib(1047);
        let atkDam = FM.round(caster.getAttrib(1039) * pDam * pExtra);
        base = FM.roundInt(Math.max(FM.roundInt(pAtk - def * FM.round(1 + defCoe)), 1) * atkDam);
      } break;
    }

    // Apply skillPar and active_skilldamage_par
    let asp = caster.getAttrib(1043);
    let damage = FM.round(base * FM.round(skillPar * asp));

    // SKILL_DAMAGE_ADD
    let sdaBufs = caster.getBuffsByGroup(BG.SKILL_DAMAGE_ADD);
    for (let sb of sdaBufs) damage += sb.addValue;

    // skill_dam_extra (unless T1045 flag)
    if (!(ignoreFlag & 2)) {
      damage = FM.roundInt(damage * caster.getAttrib(1045));
    }

    // Skill crit (unless SkillCrit flag set)
    let isSkillCrit = false;
    if (!(ignoreFlag & 1)) {
      if (DamageEngine.checkSkillCrit(caster, this.bm.rng)) {
        isSkillCrit = true;
        let scDam = caster.getAttrib(1038);
        damage = DamageEngine.skillCritDamage(damage, scDam);
      }
    }

    // Normal crit (if UseCrit flag)
    if (ignoreFlag & 4) {
      let hitType = DamageEngine.checkHit(caster, target, this.bm.rng, this.bm.isPvP, false);
      if (hitType === 2) {
        damage = FM.roundInt(damage * DamageEngine.critMultiplier(caster, target));
      }
    }

    // Boss damage
    if (target.unitType !== 1 && target.unitType !== 12) {
      let bd = caster.getAttrib(1046);
      if (bd > 0) damage = FM.roundInt(damage * FM.round(1 + bd));
    }

    // Record damage bonus
    let recBufs = caster.getBuffsByGroup(BG.RECORD_DAMAGE);
    for (let rb of recBufs) {
      let recDmg = rb.getBonus();
      if (recDmg > 0) damage = FM.roundInt(damage * FM.round(1 + FM.round(recDmg / 10000)));
    }

    // Resistance based on calType
    let resistPar = 0;
    if ([4,5].includes(calType)) {
      resistPar = DamageEngine.calArmorAndBlock(target, caster, target.getAttrib(1018), 1018, this.bm.rng).resistance;
    } else if (calType === 6) {
      resistPar = DamageEngine.calArmorAndBlock(target, caster, target.getAttrib(1034), 1034, this.bm.rng).resistance;
    } else if (calType === 7) {
      resistPar = DamageEngine.calArmorAndBlock(target, caster, target.getAttrib(1035), 1035, this.bm.rng).resistance;
    } else if (calType === 10) {
      resistPar = DamageEngine.calSuppressAndInspire(target, caster, target.getAttrib(1020), 1020, this.bm.rng).resistance;
    } else {
      resistPar = DamageEngine.calArmorAndBlock(target, caster, target.getAttrib(1019), 1034, this.bm.rng).resistance;
    }

    damage = DamageEngine.calHurt(FM.roundInt(damage * Math.max(0, FM.round(1 - resistPar))), target, caster);

    return Math.max(1, FM.roundInt(damage));
  }

  // --- Apply Bleed ---
  applyBleed(caster, target, eff) {
    let bleedType = eff.bleedType || 0;
    let skillPar = eff.skillPar || 0.5;
    let atk = caster.getAttrib(1001);
    let def = target.getAttrib(1024);
    let defCoe = target.getAttrib(1060);
    let atkMinusDef = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);
    let dmg = 0;

    switch (bleedType) {
      case 0: { // Normal ATK bleed
        let atkDam = caster.getAttrib(1039);
        dmg = FM.round(atkMinusDef * atkDam);
        dmg = FM.round(dmg * FM.round(skillPar * caster.getAttrib(1043)));
        dmg = DamageEngine.calHurt(FM.roundInt(dmg), target, caster);
      } break;
      case 1: { // Target curHP%
        dmg = FM.round(target.curHP * skillPar);
        dmg = FM.round(dmg * this.bm.injuryReduce);
      } break;
      case 2: { // Skill damage bleed
        dmg = FM.roundInt(atkMinusDef * caster.getAttrib(1045) * skillPar);
        let sr = DamageEngine.calArmorAndBlock(target, caster, target.getAttrib(1019), 1019, this.bm.rng).resistance;
        dmg = DamageEngine.calHurt(FM.roundInt(dmg * Math.max(0, FM.round(1 - sr))), target, caster);
        if (DamageEngine.checkSkillCrit(caster, this.bm.rng)) {
          dmg = DamageEngine.skillCritDamage(dmg, caster.getAttrib(1038));
        }
      } break;
      case 3: { // Normal ATK + armor + crit
        let atkDam = caster.getAttrib(1039);
        dmg = FM.round(atkMinusDef * atkDam);
        dmg = FM.round(dmg * FM.round(skillPar * caster.getAttrib(1043)));
        let ar = DamageEngine.calArmorAndBlock(target, caster, target.getAttrib(1018), 1018, this.bm.rng).resistance;
        dmg = DamageEngine.calHurt(FM.roundInt(dmg * Math.max(0, FM.round(1 - ar))), target, caster);
        let ht = DamageEngine.checkHit(caster, target, this.bm.rng, this.bm.isPvP, false);
        if (ht === 2) dmg = FM.roundInt(dmg * DamageEngine.critMultiplier(caster, target));
      } break;
      case 6: { // Target maxHP%
        dmg = FM.round(target.getAttrib(1002) * skillPar);
        dmg = FM.round(dmg * this.bm.injuryReduce);
      } break;
      default:
        dmg = FM.roundInt(atkMinusDef * skillPar);
    }

    dmg = Math.max(1, FM.roundInt(dmg));
    this.log.add(this.frame, 'dmg', `${caster.id} BLEED(${bleedType}) → ${target.id}: ${dmg}`);
    this.healthTarget(target, dmg, HT.Hurt_Bleed, caster);
  }

  // --- Execute Pal Attack ---
  executePalAttack(pal, defender) {
    if (!pal || !pal.isActive || pal.isDead || defender.isDead) return;

    let hitType = DamageEngine.checkHit(pal, defender, this.bm.rng, this.bm.isPvP, false);
    if (hitType === 0) {
      this.log.add(this.frame, 'miss', `${pal.id} ATK → ${defender.id}: MISS`);
      return;
    }

    let dmg = DamageEngine.normalHurt(pal, defender, hitType, this.bm.rng, true);
    let htType = hitType === 2 ? HT.Hurt_Crit : HT.Hurt;
    this.log.add(this.frame, hitType===2?'crit':'dmg',
      `${pal.id} ATK → ${defender.id}: ${dmg} ${hitType===2?'CRIT':''}`);
    this.healthTarget(defender, dmg, htType, pal);

    // Pal combo check
    if (DamageEngine.checkDoubleAct(pal, defender, this.bm.rng)) {
      let comboHit = DamageEngine.checkHit(pal, defender, this.bm.rng, this.bm.isPvP, false);
      if (comboHit > 0) {
        let comboDmg = DamageEngine.normalDoubleHurt(pal, defender, comboHit, this.bm.rng, true);
        this.log.add(this.frame, comboHit===2?'crit':'dmg',
          `${pal.id} COMBO → ${defender.id}: ${comboDmg} ${comboHit===2?'CRIT':''}`);
        this.healthTarget(defender, comboDmg, comboHit === 2 ? HT.Hurt_Double_Crit : HT.Hurt_Double, pal);
      }
    }
  }

  // --- Main Frame Tick ---
  tick() {
    if (!this.running) return false;
    this.frame++;
    if (this.frame > this.maxFrames) {
      this.running = false;
      // Draw: whoever has more HP% wins
      let p1pct = this.bm.p1.curHP / this.bm.p1.maxHP;
      let p2pct = this.bm.p2.curHP / this.bm.p2.maxHP;
      if (p1pct > p2pct) this.winner = 1;
      else if (p2pct > p1pct) this.winner = 2;
      else this.winner = 0; // true draw
      this.log.add(this.frame, 'info', `TIME OUT — ${this.winner === 0 ? 'DRAW' : 'P' + this.winner + ' wins by HP%'}`);
      return false;
    }

    let units = [this.bm.p1, this.bm.p2];
    let pals = [this.bm.pal1, this.bm.pal2];

    // 1. Buff tick
    for (let u of units) u.tickBuffs();
    for (let p of pals) if (p) p.tickBuffs();

    // 2. Energy accumulation & skill check
    for (let i = 0; i < 2; i++) {
      let u = units[i];
      let target = units[1-i];
      if (u.isDead) continue;
      if (u.isStunned()) continue;

      // Energy
      let skill = u.skills[0];
      if (skill && skill.id !== 'none') {
        let pr = FM.round(skill.powerRecovery * u.getAttrib(1013));
        u.energy += FM.round(pr * 0.033);
        if (u.energy >= skill.maxPower) {
          this.executeSkill(u, skill, target);
        }
      }
    }

    // 3. Attack cycle
    for (let i = 0; i < 2; i++) {
      let u = units[i];
      let target = units[1-i];
      if (u.isDead || target.isDead) continue;
      if (u.isStunned()) continue;

      u.attackTimer--;
      if (u.attackTimer <= 0) {
        u.attackTimer = Math.max(1, FM.roundInt(30 / Math.max(0.1, u.getAttrib(1003))));
        this.executeAttack(u, target);
      }
    }

    // 4. Pal attacks (every other frame, offset by player)
    for (let i = 0; i < 2; i++) {
      let pal = pals[i];
      if (!pal || pal.isDead) continue;
      let target = units[1-i];
      if (target.isDead) continue;

      pal.attackTimer--;
      if (pal.attackTimer <= 0) {
        pal.attackTimer = Math.max(1, FM.roundInt(30 / Math.max(0.1, pal.getAttrib(1003))));
        this.executePalAttack(pal, target);
      }
    }

    // 5. Process damage queues
    for (let u of units) {
      if (u.damageQueue.length > 0) this.processDamageQueue(u);
    }
    for (let p of pals) {
      if (p && p.damageQueue.length > 0) this.processDamageQueue(p);
    }

    // 6. Check win
    if (this.bm.p1.isDead && this.bm.p2.isDead) {
      this.winner = 0; this.running = false;
      this.log.add(this.frame, 'info', 'DOUBLE KO — DRAW');
    } else if (this.bm.p1.isDead) {
      this.winner = 2; this.running = false;
      this.log.add(this.frame, 'info', `P2 WINS at frame ${this.frame} (${(this.frame/30).toFixed(1)}s)`);
    } else if (this.bm.p2.isDead) {
      this.winner = 1; this.running = false;
      this.log.add(this.frame, 'info', `P1 WINS at frame ${this.frame} (${(this.frame/30).toFixed(1)}s)`);
    }

    return this.running;
  }
}

// ============================================================
// MODULE 10: BattleMain — Orchestrator
// ============================================================
class BattleMain {
  constructor(cfg) {
    this.rng = new FixRandom(cfg.seed || 42);
    this.isPvP = cfg.isPvP !== false;
    this.injuryReduce = cfg.injuryReduce || 1;
    this.shieldDecay = cfg.shieldDecay || 1;
    this.treatDecay = cfg.treatDecay || 1;

    this.p1 = null;
    this.p2 = null;
    this.pal1 = null;
    this.pal2 = null;
    this.combat = new CombatEngine(this);

    if (this.isPvP) {
      this.injuryReduce = getInjuryReduce(cfg.avgLevel || 220);
      this.shieldDecay = SHIELD_DECAY_PVP;
      this.treatDecay = TREAT_DECAY_PVP;
    }
  }

  init(p1Stats, p2Stats, p1Skill, p2Skill, palConfig) {
    // Create players
    this.p1 = new Unit({ id: 'P1', type: 'player', teamId: 0 });
    this.p1.battleMain = this;
    this.p1.initFromStats(p1Stats);
    this.p1.skills = [p1Skill || DEFAULT_SKILLS.generic_skill];

    this.p2 = new Unit({ id: 'P2', type: 'player', teamId: 1 });
    this.p2.battleMain = this;
    this.p2.initFromStats(p2Stats);
    this.p2.skills = [p2Skill || DEFAULT_SKILLS.generic_skill];

    // Create pals
    if (palConfig && palConfig.p1Enabled) {
      this.pal1 = new Unit({ id: 'P1-Pal', type: 'partner', teamId: 0, parent: this.p1 });
      this.pal1.battleMain = this;
      let palStats = {};
      for (let id in p1Stats) palStats[id] = p1Stats[id];
      // Pal inherits parent ATK, HP, and partner stats
      palStats[1001] = p1Stats[1001]; // ATK (will be read from parent in formulas)
      palStats[1002] = FM.roundInt((p1Stats[1002] || 500000) * 0.3); // Pal HP ~30% of player
      this.pal1.initFromStats(palStats);
      this.pal1.attackTimer = 15; // Offset from player
    }
    if (palConfig && palConfig.p2Enabled) {
      this.pal2 = new Unit({ id: 'P2-Pal', type: 'partner', teamId: 1, parent: this.p2 });
      this.pal2.battleMain = this;
      let palStats = {};
      for (let id in p2Stats) palStats[id] = p2Stats[id];
      palStats[1001] = p2Stats[1001];
      palStats[1002] = FM.roundInt((p2Stats[1002] || 500000) * 0.3);
      this.pal2.initFromStats(palStats);
      this.pal2.attackTimer = 15;
    }

    this.combat.maxFrames = 9000;
    this.combat.running = true;
  }

  // Run to completion (no UI updates)
  runToCompletion() {
    this.combat.log.enabled = false;
    while (this.combat.running) {
      this.combat.tick();
    }
    return this.combat.winner;
  }

  // Run with log
  runWithLog() {
    this.combat.log.enabled = true;
    while (this.combat.running) {
      this.combat.tick();
    }
    return this.combat.winner;
  }
}


// ============================================================
// MODULE 11: UI Controller
// ============================================================
const UI = {
  battle: null,
  animFrame: null,
  winRateRunning: false,
  winRateAbort: false,

  init() {
    this.buildPanel('panel-p1', 'P1', 'Player 1', 'p1-title');
    this.buildPanel('panel-p2', 'P2', 'Player 2', 'p2-title');
    this.resetBattle();
  },

  buildPanel(containerId, prefix, title, titleClass) {
    let el = document.getElementById(containerId);
    let html = `<div class="panel-title ${titleClass}">${title}</div>`;

    // Skill selector
    html += `<div class="stat-group"><h2 onclick="UI.toggleGroup(this)">Skill</h2><div class="stat-group-body">`;
    html += `<div class="stat-row" style="grid-column:1/-1"><label>Active Skill:</label>`;
    html += `<select id="${prefix}-skill" style="flex:1">`;
    for (let k in DEFAULT_SKILLS) {
      let s = DEFAULT_SKILLS[k];
      html += `<option value="${k}" ${k==='generic_skill'?'selected':''}>${s.name}</option>`;
    }
    html += `</select></div>`;
    html += `<div class="stat-row"><label>Max Power:</label><input type="number" id="${prefix}-maxpower" value="150" step="10"></div>`;
    html += `<div class="stat-row"><label>Power Recov:</label><input type="number" id="${prefix}-powrecov" value="100" step="10"></div>`;
    html += `</div></div>`;

    // Pal toggle
    html += `<div class="pal-toggle"><input type="checkbox" id="${prefix}-pal-enabled"><label>Enable Pal</label></div>`;

    // Stat groups
    for (let grp of STAT_GROUPS) {
      let collapsed = grp.collapsed ? ' collapsed' : '';
      html += `<div class="stat-group">`;
      html += `<h2 class="${collapsed ? 'collapsed' : ''}" onclick="UI.toggleGroup(this)">${grp.name}</h2>`;
      html += `<div class="stat-group-body${collapsed ? ' collapsed' : ''}">`;
      for (let attrId of grp.attrs) {
        let def = ATTRIB_MAP[attrId];
        if (!def) continue;
        let step = def.isRate ? '0.01' : '1';
        html += `<div class="stat-row">`;
        html += `<label title="${def.key} (${def.id})">${def.label}</label>`;
        html += `<input type="number" id="${prefix}-${def.id}" value="${def.defaultVal}" step="${step}">`;
        html += `</div>`;
      }
      html += `</div></div>`;
    }

    el.innerHTML = html;
  },

  toggleGroup(h2) {
    h2.classList.toggle('collapsed');
    let body = h2.nextElementSibling;
    if (body) body.classList.toggle('collapsed');
  },

  getStats(prefix) {
    let stats = {};
    for (let def of ATTRIB_DEFS) {
      let el = document.getElementById(`${prefix}-${def[0]}`);
      stats[def[0]] = el ? parseFloat(el.value) || 0 : def[3];
    }
    return stats;
  },

  getSkill(prefix) {
    let sel = document.getElementById(`${prefix}-skill`);
    let skillKey = sel ? sel.value : 'generic_skill';
    let skill = JSON.parse(JSON.stringify(DEFAULT_SKILLS[skillKey] || DEFAULT_SKILLS.generic_skill));

    let mp = document.getElementById(`${prefix}-maxpower`);
    let pr = document.getElementById(`${prefix}-powrecov`);
    if (mp) skill.maxPower = parseFloat(mp.value) || 150;
    if (pr) skill.powerRecovery = parseFloat(pr.value) || 100;

    return skill;
  },

  getPalConfig() {
    return {
      p1Enabled: document.getElementById('P1-pal-enabled')?.checked || false,
      p2Enabled: document.getElementById('P2-pal-enabled')?.checked || false
    };
  },

  createBattle() {
    let seed = parseInt(document.getElementById('inp-seed').value) || 42;
    let mode = document.getElementById('sel-mode').value;
    let avgLv = parseInt(document.getElementById('inp-avglv').value) || 220;
    let maxFrames = parseInt(document.getElementById('inp-maxframes').value) || 9000;

    let bm = new BattleMain({
      seed, isPvP: mode === 'pvp', avgLevel: avgLv
    });

    let p1Stats = this.getStats('P1');
    let p2Stats = this.getStats('P2');
    let p1Skill = this.getSkill('P1');
    let p2Skill = this.getSkill('P2');
    let palConfig = this.getPalConfig();

    bm.init(p1Stats, p2Stats, p1Skill, p2Skill, palConfig);
    bm.combat.maxFrames = maxFrames;

    return bm;
  },

  startBattle() {
    this.stopBattle();
    this.battle = this.createBattle();
    this.battle.combat.log.enabled = true;

    let speed = parseInt(document.getElementById('sel-speed').value);
    document.getElementById('battle-status').textContent = 'Running...';

    if (speed === 0) {
      // Instant
      this.battle.runWithLog();
      this.updateDisplay();
      this.updateStatus();
    } else {
      let framesPerTick = speed;
      let self = this;
      let tickFn = function() {
        for (let i = 0; i < framesPerTick; i++) {
          if (!self.battle.combat.running) break;
          self.battle.combat.tick();
        }
        self.updateDisplay();
        if (self.battle.combat.running) {
          self.animFrame = requestAnimationFrame(tickFn);
        } else {
          self.updateStatus();
        }
      };
      this.animFrame = requestAnimationFrame(tickFn);
    }
  },

  stepFrame() {
    if (!this.battle) {
      this.battle = this.createBattle();
      this.battle.combat.log.enabled = true;
    }
    if (this.battle.combat.running) {
      this.battle.combat.tick();
      this.updateDisplay();
      if (!this.battle.combat.running) this.updateStatus();
    }
  },

  stopBattle() {
    if (this.animFrame) {
      cancelAnimationFrame(this.animFrame);
      this.animFrame = null;
    }
    if (this.battle) {
      this.battle.combat.running = false;
    }
  },

  resetBattle() {
    this.stopBattle();
    this.battle = null;
    document.getElementById('log-container').innerHTML = '';
    document.getElementById('hp-bar-p1').style.width = '100%';
    document.getElementById('hp-bar-p2').style.width = '100%';
    document.getElementById('hp-shield-p1').style.width = '0%';
    document.getElementById('hp-shield-p2').style.width = '0%';
    document.getElementById('hp-val-p1').textContent = '— / —';
    document.getElementById('hp-val-p2').textContent = '— / —';
    document.getElementById('battle-status').textContent = 'Ready';
  },

  updateDisplay() {
    if (!this.battle) return;
    let p1 = this.battle.p1, p2 = this.battle.p2;

    // HP bars
    let p1pct = Math.max(0, p1.curHP / p1.maxHP * 100);
    let p2pct = Math.max(0, p2.curHP / p2.maxHP * 100);
    document.getElementById('hp-bar-p1').style.width = p1pct + '%';
    document.getElementById('hp-bar-p2').style.width = p2pct + '%';
    document.getElementById('hp-val-p1').textContent = `${Math.max(0,p1.curHP).toLocaleString()} / ${p1.maxHP.toLocaleString()}`;
    document.getElementById('hp-val-p2').textContent = `${Math.max(0,p2.curHP).toLocaleString()} / ${p2.maxHP.toLocaleString()}`;

    // Shield
    let s1pct = p1.maxHP > 0 ? Math.min(100, p1.shieldHP / p1.maxHP * 100) : 0;
    let s2pct = p2.maxHP > 0 ? Math.min(100, p2.shieldHP / p2.maxHP * 100) : 0;
    document.getElementById('hp-shield-p1').style.width = s1pct + '%';
    document.getElementById('hp-shield-p2').style.width = s2pct + '%';

    // Status
    let f = this.battle.combat.frame;
    document.getElementById('battle-status').textContent =
      `Frame ${f} (${(f/30).toFixed(1)}s) | P1: ${p1.curHP.toLocaleString()} HP ${p1.shieldHP>0?'[+'+p1.shieldHP+' shield]':''} | P2: ${p2.curHP.toLocaleString()} HP ${p2.shieldHP>0?'[+'+p2.shieldHP+' shield]':''}`;

    // Combat log
    let showDetail = document.getElementById('chk-detail')?.checked;
    document.getElementById('log-container').innerHTML = this.battle.combat.log.getHTML(showDetail);
    let logEl = document.getElementById('log-container');
    logEl.scrollTop = logEl.scrollHeight;
  },

  updateStatus() {
    if (!this.battle) return;
    let w = this.battle.combat.winner;
    let f = this.battle.combat.frame;
    let msg = w === 0 ? 'DRAW' : `Player ${w} WINS`;
    document.getElementById('battle-status').textContent =
      `${msg} at frame ${f} (${(f/30).toFixed(1)}s)`;
    this.updateDisplay();
  },

  setSpeed(val) {
    // Speed changes take effect on next start
  },

  // --- Win Rate Calculator ---
  async runWinRate() {
    this.winRateAbort = false;
    this.winRateRunning = true;
    let total = parseInt(document.getElementById('inp-sims').value) || 1000;
    let p1Wins = 0, p2Wins = 0, draws = 0;
    let baseSeed = parseInt(document.getElementById('inp-seed').value) || 42;

    document.getElementById('winrate-status').textContent = 'Running...';

    let batchSize = 50;
    for (let i = 0; i < total && !this.winRateAbort; i += batchSize) {
      let end = Math.min(i + batchSize, total);
      for (let j = i; j < end; j++) {
        let seed = baseSeed + j * 7919; // Prime offset for variety
        let mode = document.getElementById('sel-mode').value;
        let avgLv = parseInt(document.getElementById('inp-avglv').value) || 220;
        let maxFrames = parseInt(document.getElementById('inp-maxframes').value) || 9000;

        let bm = new BattleMain({
          seed, isPvP: mode === 'pvp', avgLevel: avgLv
        });

        let p1Stats = this.getStats('P1');
        let p2Stats = this.getStats('P2');
        let p1Skill = this.getSkill('P1');
        let p2Skill = this.getSkill('P2');
        let palConfig = this.getPalConfig();

        bm.init(p1Stats, p2Stats, p1Skill, p2Skill, palConfig);
        bm.combat.maxFrames = maxFrames;

        let winner = bm.runToCompletion();
        if (winner === 1) p1Wins++;
        else if (winner === 2) p2Wins++;
        else draws++;
      }

      // Update UI
      let done = Math.min(end, total);
      let p1pct = (p1Wins / done * 100);
      let p2pct = (p2Wins / done * 100);
      let dpct = (draws / done * 100);
      document.getElementById('winrate-progress').style.width = (done / total * 100) + '%';
      document.getElementById('winrate-p1').style.width = Math.max(1, p1pct) + '%';
      document.getElementById('winrate-p1').textContent = `P1: ${p1pct.toFixed(1)}%`;
      document.getElementById('winrate-p2').style.width = Math.max(1, p2pct) + '%';
      document.getElementById('winrate-p2').textContent = `P2: ${p2pct.toFixed(1)}%`;
      document.getElementById('winrate-draws').style.width = dpct + '%';
      document.getElementById('winrate-draws').textContent = dpct > 3 ? `Draw: ${dpct.toFixed(1)}%` : '';
      document.getElementById('winrate-status').textContent = `${done}/${total} (P1:${p1Wins} P2:${p2Wins} D:${draws})`;

      // Yield to UI
      await new Promise(r => setTimeout(r, 0));
    }

    this.winRateRunning = false;
    if (this.winRateAbort) {
      document.getElementById('winrate-status').textContent += ' (stopped)';
    } else {
      document.getElementById('winrate-status').textContent += ' DONE';
    }
  },

  stopWinRate() {
    this.winRateAbort = true;
  },

  // --- Export/Import ---
  exportStats() {
    let data = {
      p1: this.getStats('P1'),
      p2: this.getStats('P2'),
      p1Skill: document.getElementById('P1-skill')?.value,
      p2Skill: document.getElementById('P2-skill')?.value,
      p1MaxPower: document.getElementById('P1-maxpower')?.value,
      p2MaxPower: document.getElementById('P2-maxpower')?.value,
      p1PowRecov: document.getElementById('P1-powrecov')?.value,
      p2PowRecov: document.getElementById('P2-powrecov')?.value,
      p1Pal: document.getElementById('P1-pal-enabled')?.checked,
      p2Pal: document.getElementById('P2-pal-enabled')?.checked,
      seed: document.getElementById('inp-seed')?.value,
      mode: document.getElementById('sel-mode')?.value,
      avgLv: document.getElementById('inp-avglv')?.value,
    };
    let json = JSON.stringify(data, null, 2);
    let blob = new Blob([json], { type: 'application/json' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'battlesim-config.json';
    a.click();
    URL.revokeObjectURL(url);
  },

  importStats() {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      let file = e.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = (ev) => {
        try {
          let data = JSON.parse(ev.target.result);
          if (data.p1) this.setStats('P1', data.p1);
          if (data.p2) this.setStats('P2', data.p2);
          if (data.p1Skill) { let el = document.getElementById('P1-skill'); if (el) el.value = data.p1Skill; }
          if (data.p2Skill) { let el = document.getElementById('P2-skill'); if (el) el.value = data.p2Skill; }
          if (data.p1MaxPower) { let el = document.getElementById('P1-maxpower'); if (el) el.value = data.p1MaxPower; }
          if (data.p2MaxPower) { let el = document.getElementById('P2-maxpower'); if (el) el.value = data.p2MaxPower; }
          if (data.p1PowRecov) { let el = document.getElementById('P1-powrecov'); if (el) el.value = data.p1PowRecov; }
          if (data.p2PowRecov) { let el = document.getElementById('P2-powrecov'); if (el) el.value = data.p2PowRecov; }
          if (data.p1Pal !== undefined) { let el = document.getElementById('P1-pal-enabled'); if (el) el.checked = data.p1Pal; }
          if (data.p2Pal !== undefined) { let el = document.getElementById('P2-pal-enabled'); if (el) el.checked = data.p2Pal; }
          if (data.seed) document.getElementById('inp-seed').value = data.seed;
          if (data.mode) document.getElementById('sel-mode').value = data.mode;
          if (data.avgLv) document.getElementById('inp-avglv').value = data.avgLv;
        } catch (err) {
          alert('Invalid JSON file: ' + err.message);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  },

  setStats(prefix, stats) {
    for (let id in stats) {
      let el = document.getElementById(`${prefix}-${id}`);
      if (el) el.value = stats[id];
    }
  }
};

// ============================================================
// MODULE 12: Self-Test (Pipeline Verification)
// ============================================================
function selfTest() {
  // Verify against reverse-engineered/99_FULL_DAMAGE_PIPELINE.md
  // ATK=10000, DEF=5000, def_coe=0.1, att_dam=2.5, att_resist=0.3
  // resist=0.15, crit_dam=1.8, crit_def=0.8

  console.log('=== BattleSim v2 Self-Test ===');

  // FixMath tests
  console.assert(FM.round(1.75001) === 1.75, 'FM.round');
  console.assert(FM.round(-1.75001) === -1.75, 'FM.round neg');
  console.assert(FM.roundInt(7875.5) === 7875, 'FM.roundInt');
  console.assert(FM.roundInt(6693.75) === 6693, 'FM.roundInt 2');
  console.assert(FM.clamp(5, 1, 10) === 5, 'FM.clamp');
  console.assert(FM.clamp(-1, 0, 10) === 0, 'FM.clamp lo');

  // Damage pipeline test
  let atk = 10000, def = 5000, defCoe = 0.1, attDam = 2.5, attResist = 0.3;
  let resist = 0.15, critDam = 1.8, critDef = 0.8;

  // Step 3: Base damage
  let baseRaw = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);
  console.assert(baseRaw === 4500, `baseRaw: expected 4500, got ${baseRaw}`);

  // Step 3d: with multiplier
  let resFactor = FM.round(attDam * FM.round(1 - attResist));
  console.assert(resFactor === 1.75, `resFactor: expected 1.75, got ${resFactor}`);
  let baseDmg = FM.roundInt(baseRaw * resFactor);
  console.assert(baseDmg === 7875, `baseDmg: expected 7875, got ${baseDmg}`);

  // Step 4: calHurt (resist=0.15, no pve)
  let afterResist = FM.roundInt(FM.roundInt(baseDmg * FM.round(1 - resist)) * FM.round(1 - 0));
  console.assert(afterResist === 6693, `afterResist: expected 6693, got ${afterResist}`);

  // Step 5: Crit
  let critMult = Math.max(1.5, FM.round(critDam / Math.max(0.5, critDef)));
  console.assert(critMult === 2.25, `critMult: expected 2.25, got ${critMult}`);
  let critDmg = FM.roundInt(afterResist * critMult);
  console.assert(critDmg === 15059, `critDmg: expected 15059, got ${critDmg}`);

  // Step 8: PvP reduction (injuryReduce=25)
  let pvpDmg = Math.max(FM.roundInt(critDmg / 25), 1);
  console.assert(pvpDmg === 602, `pvpDmg: expected 602, got ${pvpDmg}`);

  // FixRandom test
  let rng = new FixRandom(42);
  let vals = [];
  for (let i = 0; i < 5; i++) vals.push(rng.randomInt(0, 100));
  console.log('RNG test (seed=42):', vals);

  // Skill crit exponent test
  let scDmg = DamageEngine.skillCritDamage(100000, 1.5);
  console.log('Skill crit test: 100000 × (1+1.5) ^0.98 =', scDmg);
  // Expected: roundInt(pow(250000, 0.98)) = 194976
  console.assert(Math.abs(scDmg - 194976) < 2, `skillCrit: expected ~194976, got ${scDmg}`);

  console.log('=== Self-Test Complete ===');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  UI.init();
  selfTest();
});
</script>
