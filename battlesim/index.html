<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOM BattleSim v2 — Precise PvP Combat Simulator</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --fg: #e0e0e0; --fg2: #a0a0b0; --accent: #e94560;
  --accent2: #0f9b8e; --green: #4ecca3; --red: #e94560;
  --gold: #f5c518; --blue: #5c9ded; --purple: #b06ab3;
  --border: #2a2a4a; --input-bg: #1e1e3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Consolas','Monaco','Courier New',monospace; background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.4; }
.container { max-width: 1600px; margin: 0 auto; padding: 8px; }
h1 { text-align: center; color: var(--accent); font-size: 18px; margin: 8px 0; }
h2 { font-size: 14px; color: var(--accent2); margin: 4px 0; cursor: pointer; user-select: none; }
h2::before { content: '▼ '; font-size: 10px; }
h2.collapsed::before { content: '▶ '; }

/* Controls bar */
.controls { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.controls button { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); padding: 4px 12px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 12px; }
.controls button:hover { background: var(--accent); }
.controls button.active { background: var(--accent); }
.controls label { color: var(--fg2); font-size: 11px; }
.controls input[type="number"] { width: 80px; background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-family: inherit; font-size: 12px; }
.controls select { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-family: inherit; font-size: 12px; }

/* Player panels */
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; max-height: 600px; overflow-y: auto; }
.panel-title { font-size: 14px; font-weight: bold; text-align: center; padding: 4px; margin-bottom: 6px; }
.p1-title { color: var(--blue); border-bottom: 2px solid var(--blue); }
.p2-title { color: var(--red); border-bottom: 2px solid var(--red); }

/* Stat groups */
.stat-group { margin-bottom: 4px; }
.stat-group-body { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; padding: 4px 0; }
.stat-group-body.collapsed { display: none; }
.stat-row { display: flex; align-items: center; gap: 4px; }
.stat-row label { flex: 1; font-size: 11px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.stat-row input { width: 72px; background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); padding: 2px 4px; border-radius: 2px; font-family: inherit; font-size: 12px; text-align: right; }
.stat-row input:focus { border-color: var(--accent2); outline: none; }

/* HP bars */
.hp-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-bottom: 8px; }
.hp-bar-container { margin: 4px 0; }
.hp-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
.hp-bar { height: 24px; background: #333; border-radius: 3px; position: relative; overflow: hidden; }
.hp-bar-fill { height: 100%; transition: width 0.1s; border-radius: 3px; }
.hp-bar-shield { position: absolute; top: 0; right: 0; height: 100%; background: rgba(92,157,237,0.5); border-radius: 3px; }
.p1-hp { background: linear-gradient(90deg, #1a5276, #2e86c1); }
.p2-hp { background: linear-gradient(90deg, #922b21, #e74c3c); }

/* Combat log */
.log-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-bottom: 8px; }
.log-container { max-height: 400px; overflow-y: auto; font-size: 11px; line-height: 1.5; }
.log-entry { padding: 1px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.log-frame { color: var(--fg2); }
.log-dmg { color: var(--red); }
.log-heal { color: var(--green); }
.log-miss { color: var(--fg2); font-style: italic; }
.log-crit { color: var(--gold); font-weight: bold; }
.log-buff { color: var(--purple); }
.log-info { color: var(--accent2); }
.log-detail { color: #888; font-size: 10px; padding-left: 16px; }

/* Win rate */
.winrate-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-bottom: 8px; }
.winrate-bar { height: 30px; background: #333; border-radius: 3px; display: flex; overflow: hidden; margin: 4px 0; }
.winrate-p1 { background: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; transition: width 0.3s; }
.winrate-p2 { background: var(--red); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; transition: width 0.3s; }
.winrate-draws { background: #666; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: width 0.3s; }
.progress-bar { height: 4px; background: #333; border-radius: 2px; margin: 4px 0; }
.progress-fill { height: 100%; background: var(--accent2); border-radius: 2px; transition: width 0.1s; }

/* Skill config */
.skill-row { display: flex; gap: 4px; align-items: center; margin: 2px 0; font-size: 11px; }
.skill-row input { width: 60px; }
.skill-row select { font-size: 11px; }

/* Pal section */
.pal-toggle { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
.pal-toggle input[type="checkbox"] { accent-color: var(--accent2); }

/* Responsive */
@media (max-width: 900px) {
  .panels { grid-template-columns: 1fr; }
  .stat-group-body { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1>LOM BattleSim v2 — Precise PvP Combat Simulator</h1>

    <button onclick="UI.importStats()">Import JSON</button>
  </div>

  <!-- Player Panels -->
  <div class="panels">
    <div class="panel" id="panel-p1"></div>
    <div class="panel" id="panel-p2"></div>
  </div>

  <!-- HP Bars -->
  <div class="hp-section">
    <div class="hp-bar-container">
      <div class="hp-bar-label"><span id="hp-label-p1" style="color:var(--blue)">Player 1</span><span id="hp-val-p1">0 / 0</span></div>
      <div class="hp-bar"><div class="hp-bar-fill p1-hp" id="hp-bar-p1" style="width:100%"></div><div class="hp-bar-shield" id="hp-shield-p1" style="width:0%"></div></div>
    </div>
    <div class="hp-bar-container">
      <div class="hp-bar-label"><span id="hp-label-p2" style="color:var(--red)">Player 2</span><span id="hp-val-p2">0 / 0</span></div>
      <div class="hp-bar"><div class="hp-bar-fill p2-hp" id="hp-bar-p2" style="width:100%"></div><div class="hp-bar-shield" id="hp-shield-p2" style="width:0%"></div></div>
    </div>
    <div id="battle-status" style="text-align:center;padding:4px;color:var(--fg2);font-size:12px;">Ready</div>
  </div>

  <!-- Combat Log -->
  <div class="log-section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <h2 style="margin:0;cursor:default;" onclick="this.classList.toggle('collapsed');document.getElementById('log-container').classList.toggle('collapsed')">Combat Log</h2>
      <label style="font-size:11px;color:var(--fg2)"><input type="checkbox" id="chk-detail" checked> Show detail</label>
    </div>
    <div class="log-container" id="log-container"></div>
  </div>

  <!-- Win Rate -->
  <div class="winrate-section">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
      <h2 style="margin:0;cursor:default;">Win Rate Calculator</h2>
      <label style="font-size:11px;">Sims:</label>
      <input type="number" id="inp-sims" value="1000" min="10" max="100000" step="100" style="width:70px;background:var(--input-bg);color:var(--fg);border:1px solid var(--border);padding:2px 4px;border-radius:2px;font-family:inherit;font-size:12px;">
      <button onclick="UI.runWinRate()" style="background:var(--bg3);color:var(--fg);border:1px solid var(--border);padding:4px 12px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12px;">Run</button>
      <button onclick="UI.stopWinRate()" style="background:var(--bg3);color:var(--fg);border:1px solid var(--border);padding:4px 12px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12px;">Stop</button>
      <span id="winrate-status" style="font-size:11px;color:var(--fg2);">—</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="winrate-progress" style="width:0%"></div></div>
    <div class="winrate-bar">
      <div class="winrate-p1" id="winrate-p1" style="width:50%">P1: —</div>
      <div class="winrate-draws" id="winrate-draws" style="width:0%"></div>
      <div class="winrate-p2" id="winrate-p2" style="width:50%">P2: —</div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// MODULE 1: FixMath — Exact replica of game_script.js line 4973
// ============================================================
const FM = {
  round(x) {
    return (x > 0 ? Math.floor(1e4 * x + 0.5) : Math.ceil(1e4 * x - 0.5)) / 1e4;
  },
  roundInt(x) {
    return Math.floor(FM.round(x));
  },
  clamp(x, mn, mx) {
    if (mn > mx) { let t = mn; mn = mx; mx = t; }
    return x < mn ? mn : x > mx ? mx : x;
  }
};

// ============================================================
// MODULE 2: FixRandom — Exact replica of game_script.js line 4975
// ============================================================
class FixRandom {
  constructor(seed) {
    this._seed = FM.roundInt(Number(seed || 9));
  }
  get seed() { return this._seed; }
  set seed(v) { this._seed = FM.roundInt(Number(v)); }

  getRand() {
    let n = FM.roundInt(FM.roundInt(13 * this._seed) + 147);
    let t = Math.floor(FM.round(n / 256));
    let r = FM.round(n - FM.round(256 * t));
    this._seed = r;
    return FM.round(r / 256);
  }

  randomInt(min, max) {
    if (min === undefined) min = 1;
    if (max === undefined) max = 10;
    if (min === max) return min;
    let range = max - min;
    let o = FM.roundInt(9301 * this._seed + 49297) % 233280;
    this._seed = o;
    o = FM.round(o / 233280);
    let u = Math.floor(FM.round(o * range));
    u += min;
    u = FM.roundInt(u);
    if (u >= max) u = max - 1;
    return u;
  }
}

// ============================================================
// MODULE 3: Constants & Attribute Definitions
// ============================================================
const MISS_CORRECT = 0.9;      // 9000/10000
const VERTIGO_CORRECT = 0.9;   // 9000/10000
const SHIELD_DECAY_PVP = 0.4;  // 4000/10000
const TREAT_DECAY_PVP = 0.3;   // 3000/10000
const TOTAL_DAM_FLOOR = 0.2;   // 2000/10000
const PVP_MISS_CAP = 0.8;      // 8000/10000
const PIERCE_BLOCK_CAP = 0.5;
const CONFIG_KEY = 24455;

// PvP injury reduce by level (approximated from ConfigLevel)
// Key levels with their pvp_injury_reduce/10000 values
const PVP_INJURY_TABLE = {
  1: 1, 10: 1.5, 20: 2, 30: 3, 40: 4, 50: 5, 60: 6, 70: 7.5,
  80: 9, 90: 10.5, 100: 12, 110: 13.5, 120: 15, 130: 17, 140: 19,
  150: 21, 160: 23, 170: 25, 180: 27, 190: 29, 200: 31, 210: 33,
  220: 35, 230: 37, 240: 39, 250: 41, 260: 43, 270: 45, 280: 47, 290: 49, 300: 50
};

function getInjuryReduce(avgLevel) {
  if (avgLevel <= 1) return 1;
  let keys = Object.keys(PVP_INJURY_TABLE).map(Number).sort((a,b) => a-b);
  let lo = keys[0], hi = keys[keys.length - 1];
  if (avgLevel >= hi) return PVP_INJURY_TABLE[hi];
  for (let i = 0; i < keys.length - 1; i++) {
    if (avgLevel >= keys[i] && avgLevel < keys[i+1]) {
      let t = (avgLevel - keys[i]) / (keys[i+1] - keys[i]);
      return FM.round(PVP_INJURY_TABLE[keys[i]] * (1-t) + PVP_INJURY_TABLE[keys[i+1]] * t);
    }
  }
  return PVP_INJURY_TABLE[hi];
}

// Stat groups for UI layout

  { name: 'Core', attrs: [1001, 1002, 1024, 1060] },

// Attribute upper limits (key caps from ConfigAttribute)
const ATTRIB_CAPS = {
  1008: 0.8,   // evasion PvP cap
  1018: 0.8,   // att_resist cap
  1019: 0.8,   // skill_resist cap
  1020: 0.8,   // partner_resist cap
  1034: 0.8,   // double_hit_def cap
  1035: 0.8,   // counter_def cap
};


// ============================================================
// MODULE 4: Unit — Combat Entity
// ============================================================
class Unit {
  constructor(cfg) {
    this.id = cfg.id || 'unit';
    this.type = cfg.type || 'player'; // player, partner, spirit
    this.teamId = cfg.teamId || 0;
    this.parent = cfg.parent || null;
    this.attribs = {};
    this.curHP = 0;
    this.maxHP = 0;
    this.shieldHP = 0;
    this.energy = 0;
    this.maxPower = 150;
    this.powerRecoveryBase = 100;
    this.attackTimer = 0;
    this.attackInterval = 30; // frames between attacks
    this.stunFrames = 0;
    this.isDead = false;
    this.buffs = [];
    this.damageQueue = [];
    this.skills = [];
    this.skillCooldowns = [];
    this.unitType = cfg.unitType || 1; // 1=player, 12=hero
    this.battleMain = null;

    // Pal-specific
    this.isActive = true;

    // Init defaults
    for (let def of ATTRIB_DEFS) {
      this.attribs[def[0]] = def[3];
    }
  }

  getAttrib(id) {
    let v = this.attribs[id];
    if (v === undefined) return 0;
    // Apply buff attribute modifications
    let flat = 0, mult = 1, extra = 0;
    for (let b of this.buffs) {
      if (b.isActive && b.group === BG.ATTRIB && b.attribId === id) {
        if (b.modType === 'flat') flat += b.modValue;
        else if (b.modType === 'mult') mult = FM.round(mult + FM.round(b.modValue));
        else if (b.modType === 'extra') extra += b.modValue;
      }
    }
    return FM.round(FM.roundInt(FM.round(v + flat) * mult) + extra);
  }

  setAttrib(id, val) {
    this.attribs[id] = val;
  }

  initFromStats(stats) {
    for (let id in stats) {
      this.attribs[Number(id)] = stats[id];
    }
    this.maxHP = this.getAttrib(1002);
    this.curHP = this.maxHP;
    this.attackInterval = Math.max(1, FM.roundInt(30 / Math.max(0.1, this.getAttrib(1003))));
    this.attackTimer = this.attackInterval;
  }

  addBuff(buff) {
    // Mutex check (simplified: replace by group for unique buffs)
    if (buff.mutex === 2) { // UNIQUE
      if (this.buffs.some(b => b.isActive && b.group === buff.group && b.buffId === buff.buffId)) return false;
    } else if (buff.mutex === 1) { // REPLACE
      this.buffs.filter(b => b.isActive && b.group === buff.group && b.buffId === buff.buffId)
        .forEach(b => { b.isActive = false; b.onEnd(); });
    } else if (buff.mutex === 3) { // STACK
      let existing = this.buffs.filter(b => b.isActive && b.group === buff.group && b.buffId === buff.buffId);
      if (buff.addMax > 0 && existing.length >= buff.addMax) {
        // Remove oldest
        existing[0].isActive = false;
        existing[0].onEnd();
      }
      // Refresh existing durations
      existing.forEach(b => { b.remainingFrames = buff.remainingFrames; });
    } else if (buff.mutex === 4) { // PER_CASTER
      this.buffs.filter(b => b.isActive && b.group === buff.group && b.buffId === buff.buffId && b.caster === buff.caster)
        .forEach(b => { b.isActive = false; b.onEnd(); });
    } else if (buff.mutex === 5) { // REFRESH
      let existing = this.buffs.filter(b => b.isActive && b.group === buff.group && b.buffId === buff.buffId && b.caster === buff.caster);
      if (existing.length > 0) {
        existing.forEach(b => { b.remainingFrames = buff.remainingFrames; });
        return false;
      }
    }
    // Control immunity check
    if ([BG.DIZZ, BG.FROZEN, BG.BOUND, BG.TAUNT, BG.BAN_ACT, BG.BAN_SKILL].includes(buff.group)) {
      if (this.buffs.some(b => b.isActive && (b.group === BG.INVINCIBLE || b.group === BG.NOT_CONTROLLED))) {
        return false;
      }
    }
    buff.owner = this;
    this.buffs.push(buff);
    buff.onBegin();
    return true;
  }

  removeBuffsByGroup(group) {
    this.buffs.filter(b => b.isActive && b.group === group).forEach(b => {
      b.isActive = false; b.onEnd();
    });
  }

  getBuffsByGroup(group) {
    return this.buffs.filter(b => b.isActive && b.group === group);
  }

  hasBuffGroup(group) {
    return this.buffs.some(b => b.isActive && b.group === group);
  }

  tickBuffs() {
    for (let b of this.buffs) {
      if (!b.isActive) continue;
      if (b.remainingFrames > 0) {
        b.remainingFrames--;
        b.onTick();
        if (b.remainingFrames <= 0) {
          b.isActive = false;
          b.onEnd();
        }
      } else if (b.remainingFrames === -1) {
        // Permanent buff
        b.onTick();
      }
    }
    // Cleanup dead buffs periodically
    if (this.buffs.length > 50) {
      this.buffs = this.buffs.filter(b => b.isActive);
    }
    // Update stun status
    this.stunFrames = Math.max(0, this.stunFrames - 1);
  }

  isStunned() {
    return this.stunFrames > 0 || this.buffs.some(b => b.isActive &&
      (b.group === BG.DIZZ || b.group === BG.FROZEN || b.group === BG.BAN_ACT));
  }
}

// ============================================================
// MODULE 5: Buff Base Class & Subclasses
// ============================================================
class Buff {
  constructor(cfg) {
    this.buffId = cfg.buffId || 0;
    this.group = cfg.group || 0;
    this.mutex = cfg.mutex || 1;
    this.addMax = cfg.addMax || 0;
    this.caster = cfg.caster || null;
    this.owner = null;
    this.target = cfg.target || null;
    this.skillPar = cfg.skillPar || 0;
    this.remainingFrames = cfg.duration || -1; // -1 = permanent
    this.isActive = true;
    this.battleMain = cfg.battleMain || null;
  }
  onBegin() {}
  onTick() {}
  onEnd() {}
}

class BuffAttrib extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.ATTRIB;
    this.attribId = cfg.attribId || 1001;
    this.modType = cfg.modType || 'flat'; // flat, mult, extra
    this.modValue = cfg.modValue || 0;
  }
}

class BuffShield extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.SHIELD;
    this.calType = cfg.calType || 0;
    this.attribId = cfg.attribId || 1002;
    this.hpType = cfg.hpType || 1;
    this.isDec = cfg.isDec || 0;
    this.shieldValue = 0;
  }
  onBegin() {
    let base = 0;
    let src = (this.hpType & 2) ? this.owner : this.caster;
    let tgt = this.owner;
    switch (this.calType) {
      case 0: base = src.getAttrib(this.attribId); break;
      case 1: {
        let atk = this.caster.getAttrib(1001);
        let def = tgt.getAttrib(1024);
        let defCoe = tgt.getAttrib(1060);
        base = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);
      } break;
      case 2: base = FM.roundInt(this.caster.getAttrib(1002) - tgt.curHP); break;
      case 3: base = FM.roundInt(tgt.curHP); break;
    }
    this.shieldValue = FM.roundInt(base * this.skillPar);
    this.shieldValue = FM.roundInt(this.shieldValue * FM.round(1 + tgt.getAttrib(1051)));
    if (this.isDec === 0 && this.battleMain) {
      this.shieldValue = FM.roundInt(this.shieldValue * this.battleMain.shieldDecay);
    }
    this.shieldValue = Math.max(1, this.shieldValue);
    this.owner.shieldHP += this.shieldValue;
  }
  absorb(damage) {
    if (this.shieldValue <= 0 || !this.isActive) return 0;
    let absorbed = Math.min(this.shieldValue, damage);
    this.shieldValue -= absorbed;
    if (this.shieldValue <= 0) {
      this.isActive = false;
      this.onEnd();
    }
    return absorbed;
  }
  onEnd() {
    if (this.owner && this.shieldValue > 0) {
      this.owner.shieldHP = Math.max(0, this.owner.shieldHP - this.shieldValue);
      this.shieldValue = 0;
    }
  }
}

class BuffReduceHeal extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.REDUCE_HEAL;
    this.reducePct = cfg.reducePct || 0.5; // reduce healing by this fraction
  }
  calHeal(amount) {
    return FM.roundInt(amount * FM.round(1 - this.reducePct));
  }
}

class BuffExtraDamage extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.EXTRA_DAMAGE;
    this.calType = cfg.calType || 0; // 0=fixed%, 1=hp-loss%, 2=curHP%
    this.extraPct = cfg.extraPct || 0;
  }
  calDamage(damage, target) {
    switch (this.calType) {
      case 0: return FM.roundInt(damage * FM.round(1 + this.extraPct));
      case 1: {
        let hpLoss = FM.round((this.caster.maxHP - this.caster.curHP) / this.caster.maxHP);
        return FM.roundInt(damage * FM.round(1 + FM.round(hpLoss * this.extraPct)));
      }
      case 2: {
        let hpPct = FM.round(this.caster.curHP / this.caster.maxHP);
        return FM.roundInt(damage * FM.round(1 + FM.round(hpPct * this.extraPct)));
      }
    }
    return damage;
  }
}

class BuffGiantSlayer extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.GIANT_SLAYER;
    this.extraDam = cfg.extraDam || 0;    // damage per 1% HP diff (basis points)
    this.maxBoss = cfg.maxBoss || 0;       // cap for boss (basis points)
    this.maxUnit = cfg.maxUnit || 0;       // cap for player/hero (basis points)
  }
  calDamage(damage, target) {
    let ownerHp = this.owner.getAttrib(1002);
    let targetHp = target.getAttrib(1002);
    if (targetHp <= ownerHp) return damage;
    let diffPct = Math.ceil(FM.round((targetHp - ownerHp) / ownerHp * 100));
    let rawBonus = FM.round(diffPct * this.extraDam);
    let cap = (target.unitType === 1 || target.unitType === 12) ? this.maxUnit : this.maxBoss;
    let bonus = Math.min(rawBonus, cap);
    return FM.round(damage * (1 + bonus / 10000));
  }
}

class BuffFragileEffect extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.FRAGILE_EFFECT;
    this.calType = cfg.calType || 0;
    this.attribId = cfg.attribId || 1001;
  }
  calDamage(damage, attacker) {
    if (this.calType === 0) {
      return FM.roundInt(attacker.getAttrib(this.attribId) * this.skillPar);
    } else {
      return FM.roundInt(attacker.curHP * this.skillPar);
    }
  }
}

class BuffRecordDamage extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.RECORD_DAMAGE;
    this.recorded = 0;
  }
  addDamage(dmg) { this.recorded += dmg; }
  getBonus() { return this.recorded; }
}

class BuffVampire extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.VAMPIRE;
    this.maxPct = cfg.maxPct || 0.5;
    this.skillDamFactor = cfg.skillDamFactor || 1.0;
  }
  calDamage(damage, target, attacker) {
    if (!this.battleMain) return;
    let totalAdd = attacker.getAttrib(1081);
    let totalDef = this.owner.getAttrib(1082);
    let totalMult = Math.max(1 + totalAdd - totalDef, TOTAL_DAM_FLOOR);
    let healBase = FM.round(damage * totalMult);
    let healCap = FM.round(attacker.maxHP * this.maxPct);
    healBase = Math.max(FM.roundInt(healBase / this.battleMain.injuryReduce), 1);
    let healAmount = FM.round(healBase * this.skillDamFactor);
    if (healAmount > healCap) healAmount = healCap;
    let effectiveHeal = FM.round(healAmount / this.battleMain.treatDecay);
    this.battleMain.combat.healthTarget(attacker, FM.roundInt(effectiveHeal), HT.Treat, attacker);
  }
}

class BuffSkillDamageAdd extends Buff {
  constructor(cfg) {
    super(cfg);
    this.group = BG.SKILL_DAMAGE_ADD;
    this.addValue = cfg.addValue || 0;
  }
}


// ============================================================
// MODULE 6: DamageEngine — All combat formulas
// Matches HurtUtil in game_script.js lines 322750-323007
// ============================================================
const DamageEngine = {

  // --- Hit Determination (checkHit) ---
  // Returns: 0=miss, 1=normal, 2=crit
  // Source: game_script.js line 322896
  checkHit(attacker, defender, rng, isPvP, ignoreMiss) {
    let miss = ignoreMiss ? 0 : defender.getAttrib(1008);
    let hit = attacker.getAttrib(1007);
    let critRate = attacker.getAttrib(1004);
    let ignoreCrit = defender.getAttrib(1065);
    let effectiveCrit = Math.max(critRate - ignoreCrit, 0);

    // Raw evasion
    let rawMiss = Math.max(FM.round(miss - hit), 0);

    // Power curve correction: (100*raw)^0.9 / 100
    let corrected = 0;
    if (rawMiss > 0) {
      corrected = FM.round(Math.pow(FM.round(100 * rawMiss), MISS_CORRECT) / 100);
    }

    // PvP cap
    let finalMiss = isPvP ? Math.min(corrected, PVP_MISS_CAP) : corrected;

    // Build probability ranges (out of 10000)
    let pMiss = FM.roundInt(10000 * finalMiss);
    let pNormal = pMiss + FM.roundInt(FM.round(FM.round(1 - finalMiss) * FM.round(1 - effectiveCrit)) * 10000);

    let roll = rng.randomInt(0, 10000);
    if (roll <= pMiss) return 0; // Miss
    if (roll <= pNormal) return 1; // Normal
    return 2; // Crit
  },

  // --- Combo Check (checkDoubleAct) ---
  // Source: game_script.js line 322918
  checkDoubleAct(attacker, defender, rng) {
    let dh = attacker.getAttrib(1016);
    let ign = defender ? defender.getAttrib(1048) : 0;
    let prob = FM.roundInt(10000 * Math.max(FM.round(dh - ign), 0));
    if (prob <= 0) return false;
    return rng.randomInt(0, 10000) <= prob;
  },

  // --- Counter Check (checkCounterAct) ---
  // Source: game_script.js line 322932
  checkCounterAct(counterUnit, attacker, rng) {
    let ctr = counterUnit.getAttrib(1017);
    let ign = attacker ? attacker.getAttrib(1049) : 0;
    let prob = FM.roundInt(10000 * Math.max(FM.round(ctr - ign), 0));
    if (prob <= 0) return false;
    return rng.randomInt(0, 10000) <= prob;
  },

  // --- Stun Check (checkDizz) ---
  // Source: game_script.js line 322947
  checkDizz(attacker, defender, rng) {
    let v = attacker.getAttrib(1023);
    let vd = defender.getAttrib(1026);
    let base = Math.max(0, FM.round(v - vd));
    if (base <= 0) return false;
    let corrected = FM.round(Math.pow(FM.round(100 * base), VERTIGO_CORRECT) / 100);
    let prob = FM.roundInt(10000 * corrected);
    if (prob <= 0) return false;
    return rng.randomInt(0, 10000) <= prob;
  },

  // --- Launch Check (checkThrowHit) ---
  // Source: game_script.js line 322960
  checkThrowHit(attacker, defender, rng) {
    let s = attacker.getAttrib(1022);
    let sd = defender.getAttrib(1025);
    let effective = FM.round(s - sd);
    let prob = FM.roundInt(10000 * effective);
    if (prob <= 0) return false;
    return rng.randomInt(0, 10000) <= prob;
  },

  // --- Skill Crit Check (checkSkillCrit) ---
  // NOTE: Uses strict < (not <=) unlike other checks
  // Source: game_script.js line 322938
  checkSkillCrit(unit, rng) {
    let rate = unit.getAttrib(1037);
    let prob = FM.roundInt(10000 * rate);
    if (prob <= 0) return false;
    return rng.randomInt(0, 10000) < prob; // strict less-than
  },

  // --- Pierce/Block (calArmorAndBlock) ---
  // Source: game_script.js line 322773
  calArmorAndBlock(defender, attacker, resistance, attribKey, rng) {
    let pen = attacker.getAttrib(1068);
    let ignPen = defender.getAttrib(1069);
    let blk = defender.getAttrib(1071);
    let ignBlk = attacker.getAttrib(1072);

    let canPen = pen > ignPen;
    let canBlock = blk > ignBlk;

    let penProb = canPen ? FM.roundInt(10000 * attacker.getAttrib(1067)) : 0;
    let blkProb = canBlock ? FM.roundInt(10000 * defender.getAttrib(1070)) : 0;

    let roll = rng.randomInt(0, 10000);
    let outcome = 2; // neither
    if (roll <= penProb) {
      outcome = 0; // pierce
      let amount = FM.round(Math.min(PIERCE_BLOCK_CAP, (pen - ignPen) / 10000));
      resistance = FM.round(resistance - amount);
    } else if (roll <= penProb + blkProb) {
      outcome = 1; // block
      let amount = FM.round(Math.min(PIERCE_BLOCK_CAP, (blk - ignBlk) / 10000));
      resistance = FM.round(resistance + amount);
    }

    // Cap resistance by attribute up_limit
    let cap = ATTRIB_CAPS[attribKey];
    if (cap !== undefined) {
      resistance = Math.min(resistance, cap);
    }
    return { resistance, outcome };
  },

  // --- Pal Inspire/Suppress (calSuppressAndInspire) ---
  // Source: game_script.js line 322802
  calSuppressAndInspire(defender, attacker, resistance, attribKey, rng) {
    let inspire = attacker.getAttrib(1074);
    let ignInspire = defender.getAttrib(1075);
    let suppress = defender.getAttrib(1077);
    let ignSuppress = attacker.getAttrib(1078);

    let canInspire = inspire > ignInspire;
    let canSuppress = suppress > ignSuppress;

    // NOTE: inspire uses suppress_rate, suppress uses inspire_rate (cross-reference)
    let inspProb = canInspire ? FM.roundInt(10000 * attacker.getAttrib(1076)) : 0;
    let suppProb = canSuppress ? FM.roundInt(10000 * defender.getAttrib(1073)) : 0;

    let roll = rng.randomInt(0, 10000);
    let outcome = 2;
    if (roll <= inspProb) {
      outcome = 0; // inspire (reduce resist)
      let amount = FM.round(Math.min(PIERCE_BLOCK_CAP, (inspire - ignInspire) / 10000));
      resistance = FM.round(resistance - amount);
    } else if (roll <= inspProb + suppProb) {
      outcome = 1; // suppress (increase resist)
      let amount = FM.round(Math.min(PIERCE_BLOCK_CAP, (suppress - ignSuppress) / 10000));
      resistance = FM.round(resistance + amount);
    }

    let cap = ATTRIB_CAPS[attribKey];
    if (cap !== undefined) resistance = Math.min(resistance, cap);
    return { resistance, outcome };
  },

  // --- DMG Resistance (calHurt) ---
  // Source: game_script.js line 322831
  calHurt(dmg, defender, attacker) {
    let pveDam = attacker.getAttrib(1057);
    let resist = defender.getAttrib(1021);
    let pveResist = defender.getAttrib(1058);

    dmg = FM.roundInt(dmg * FM.round(1 + pveDam));
    dmg = FM.roundInt(FM.roundInt(dmg * FM.round(1 - resist)) * FM.round(1 - pveResist));
    return Math.max(1, dmg);
  },

  // --- Crit Multiplier ---
  critMultiplier(attacker, defender) {
    let cd = attacker.getAttrib(1005);
    let cdef = Math.max(0.5, defender.getAttrib(1006));
    return Math.max(1.5, FM.round(cd / cdef));
  },

  // --- Normal Attack Damage (normalHurt) ---
  // Source: game_script.js line 322756, data/formulas/combat/normal_hurt.json
  normalHurt(attacker, defender, hitType, rng, usePierceBlock) {
    if (usePierceBlock === undefined) usePierceBlock = true;
    let atk, mult, resist, isPal = false;

    if (attacker.type === 'partner' && attacker.parent) {
      // Pal: uses PARENT ATK
      isPal = true;
      atk = attacker.parent.getAttrib(1001);
      let palDam = attacker.getAttrib(1040);
      let palExtra = attacker.parent.getAttrib(1047);
      mult = FM.round(palDam * palExtra);
      resist = defender.getAttrib(1020);
      if (usePierceBlock && rng) {
        let r = DamageEngine.calSuppressAndInspire(defender, attacker, resist, 1020, rng);
        resist = r.resistance;
      }
    } else {
      atk = attacker.getAttrib(1001);
      mult = attacker.getAttrib(1039); // att_dam
      resist = defender.getAttrib(1018); // att_resist
      if (usePierceBlock && rng) {
        let r = DamageEngine.calArmorAndBlock(defender, attacker, resist, 1018, rng);
        resist = r.resistance;
      }
    }

    let def = defender.getAttrib(1024);
    let defCoe = defender.getAttrib(1060);
    let baseRaw = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);

    // Player: combined multiplier and resistance in one round step
    // Pal: same structure
    let dmg = FM.roundInt(baseRaw * FM.round(mult * FM.round(1 - resist)));

    // calHurt (DMG RES + PvE)
    dmg = DamageEngine.calHurt(dmg, defender, attacker);

    // Crit (applied AFTER calHurt)
    if (hitType === 2) {
      dmg = FM.roundInt(dmg * DamageEngine.critMultiplier(attacker, defender));
    }

    return Math.max(1, dmg);
  },

  // --- Combo Damage (normalDoubleHurt) ---
  // Source: game_script.js line 322839, data/formulas/combat/normal_double_hurt.json
  // KEY DIFFERENCE: multiplier and resistance are SEPARATE steps
  normalDoubleHurt(attacker, defender, hitType, rng, usePierceBlock) {
    if (usePierceBlock === undefined) usePierceBlock = true;
    let atk, isPal = false;

    if (attacker.type === 'partner' && attacker.parent) {
      isPal = true;
      atk = attacker.parent.getAttrib(1001);
    } else {
      atk = attacker.getAttrib(1001);
    }

    let def = defender.getAttrib(1024);
    let defCoe = defender.getAttrib(1060);
    let baseRaw = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);
    let dmg;

    if (isPal) {
      // Pal combo: pal mult first, then combo mult
      let palDam = attacker.getAttrib(1040);
      let palExtra = attacker.parent.getAttrib(1047);
      let palMult = FM.round(palDam * palExtra);
      let palResist = defender.getAttrib(1020);
      if (usePierceBlock && rng) {
        let r = DamageEngine.calSuppressAndInspire(defender, attacker, palResist, 1020, rng);
        palResist = r.resistance;
      }
      let palBase = FM.roundInt(FM.roundInt(baseRaw * palMult) * FM.round(1 - palResist));
      let dhDam = attacker.getAttrib(1032);
      dmg = FM.roundInt(palBase * dhDam);
    } else {
      // Player combo: separate mult and resist steps
      let dhDam = attacker.getAttrib(1032);
      let dhDef = defender.getAttrib(1034);
      if (usePierceBlock && rng) {
        let r = DamageEngine.calArmorAndBlock(defender, attacker, dhDef, 1034, rng);
        dhDef = r.resistance;
      }
      dmg = FM.roundInt(FM.roundInt(baseRaw * dhDam) * FM.round(1 - dhDef));
    }

    dmg = DamageEngine.calHurt(dmg, defender, attacker);

    if (hitType === 2) {
      dmg = FM.roundInt(dmg * DamageEngine.critMultiplier(attacker, defender));
    }

    return Math.max(1, dmg);
  },

  // --- Counter Damage (normalCounterHurt) ---
  // Source: game_script.js line 322853
  normalCounterHurt(attacker, defender, hitType, rng, usePierceBlock) {
    if (usePierceBlock === undefined) usePierceBlock = true;
    let atk = attacker.getAttrib(1001);
    let def = defender.getAttrib(1024);
    let defCoe = defender.getAttrib(1060);
    let baseRaw = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);

    let ctrDam = attacker.getAttrib(1033);
    let ctrDef = defender.getAttrib(1035);
    if (usePierceBlock && rng) {
      let r = DamageEngine.calArmorAndBlock(defender, attacker, ctrDef, 1035, rng);
      ctrDef = r.resistance;
    }
    let dmg = FM.roundInt(FM.roundInt(baseRaw * ctrDam) * FM.round(1 - ctrDef));
    dmg = DamageEngine.calHurt(dmg, defender, attacker);

    if (hitType === 2) {
      dmg = FM.roundInt(dmg * DamageEngine.critMultiplier(attacker, defender));
    }
    return Math.max(1, dmg);
  },

  // --- Skill Damage (SkillHurt) ---
  // Source: game_script.js line 322967
  // BUG REPLICATION: uses double_hit_def for calArmorAndBlock attrib key
  skillHurt(attacker, defender, hitType, rng, usePierceBlock) {
    if (usePierceBlock === undefined) usePierceBlock = true;
    let atk = attacker.getAttrib(1001);
    let def = defender.getAttrib(1024);
    let defCoe = defender.getAttrib(1060);
    let baseRaw = Math.max(FM.roundInt(atk - def * FM.round(1 + defCoe)), 1);

    let skillDamExtra = attacker.getAttrib(1045);
    let skillResist = defender.getAttrib(1019);
    if (usePierceBlock && rng) {
      // BUG: uses 1034 (double_hit_def) as attrib key for cap lookup
      let r = DamageEngine.calArmorAndBlock(defender, attacker, skillResist, 1034, rng);
      skillResist = r.resistance;
    }
    let dmg = FM.roundInt(FM.roundInt(baseRaw * skillDamExtra) * FM.round(1 - skillResist));
    dmg = DamageEngine.calHurt(dmg, defender, attacker);

    if (hitType === 2) {
      dmg = FM.roundInt(dmg * DamageEngine.critMultiplier(attacker, defender));
    }
    return Math.max(1, dmg);
  },

  // --- Skill Crit Damage (0.98 exponent) ---
  // Source: game_script.js line ~195860
  skillCritDamage(damage, skillCritDam) {
    let product = FM.roundInt(damage * FM.round(1 + skillCritDam));
    return FM.roundInt(Math.pow(product, 0.98));
  },

  // --- Normal Attack HP Steal ---
  normalHpsteal(attacker, defender, damage) {
    let rate = FM.roundInt(attacker.getAttrib(1014) - defender.getAttrib(1027));
    rate = Math.max(0, rate);
    return FM.roundInt(damage * rate);
  },

  // --- Skill HP Steal ---
  skillHpsteal(attacker, defender, damage) {
    let rate = Math.max(0, FM.round(attacker.getAttrib(1015) - defender.getAttrib(1028)));
    return FM.roundInt(damage * rate);
  },

  // --- HP Steal Trigger Check ---
  checkHpstealTrigger(attacker, defender, rng) {
    let rate = FM.roundInt(Math.max(0, 10000 * FM.round(attacker.getAttrib(1053) - defender.getAttrib(1055))));
    if (rate <= 0) return false;
    return rng.randomInt(0, 10000) <= rate;
  },

  // --- HP-Based Steal Amount ---
  hpstealAmount(unit) {
    let amount = unit.getAttrib(1054);
    let ignore = unit.getAttrib(1056);
    let effective = FM.round(amount * Math.max(0, FM.round(1 - ignore)));
    return FM.roundInt(unit.getAttrib(1002) * effective);
  },

  // --- Spirit Normal Hit ---
  // Source: game_script.js line 322981
  spiritNormalHit(spirit, defender) {
    if (defender.type === 'spirit') {
      // Spirit vs Spirit
      let atk = spirit.getAttrib(1001);
      let sda = spirit.getAttrib(6001);
      let sdd = defender.getAttrib(6002);
      let sddf = defender.getAttrib(6003);
      return FM.round(atk * FM.round(sda - sdd + 1) * FM.round(1 - sddf));
    }
    // Spirit vs Player: use parent's damage scaled by coefficients
    // Simplified: use parent normalHurt scaled by a factor
    if (spirit.parent) {
      let baseDmg = DamageEngine.normalHurt(spirit.parent, defender, 1, null, false);
      return FM.roundInt(baseDmg * 0.3); // approximate spirit scaling
    }
    return 1;
  }
};


// ============================================================
// MODULE 7: CombatLog
// ============================================================
class CombatLog {
  constructor() {
    this.entries = [];
    this.enabled = true;
  }
  clear() { this.entries = []; }

  add(frame, type, msg, detail) {
    if (!this.enabled) return;
    this.entries.push({ frame, type, msg, detail: detail || '' });
  }

  getHTML(showDetail) {
    let html = '';
    for (let e of this.entries) {
      let cls = 'log-entry';
      if (e.type === 'dmg') cls += ' log-dmg';
      else if (e.type === 'heal') cls += ' log-heal';
      else if (e.type === 'miss') cls += ' log-miss';
      else if (e.type === 'crit') cls += ' log-crit';
      else if (e.type === 'buff') cls += ' log-buff';
      else cls += ' log-info';
      html += `<div class="${cls}"><span class="log-frame">F${String(e.frame).padStart(4,'0')}</span> ${e.msg}`;
      if (showDetail && e.detail) {
        html += `<div class="log-detail">${e.detail}</div>`;
      }
      html += '</div>';
    }
    return html;
  }
}
